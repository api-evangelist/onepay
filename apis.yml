aid: onepay
name: OnePay
description: >-
  OnePay is a Walmart-backed financial technology company that delivers mobile
  banking and money services through a single consumer app, with banking
  provided by Coastal Community Bank or Lead Bank (Members FDIC). The app bundles
  everyday checking and high-yield savings, a Credit Builder loan and credit
  score monitoring, the OnePay CashRewards Mastercard credit card, buy-now-pay-later
  (OnePay Later, powered by Klarna/WebBank), a digital wallet, commission-free
  stock and ETF investing (cleared by DriveWealth), crypto buying (powered by
  Zero Hash), free tax filing, global transfers (powered by MoneyGram), and cash
  back tied to Walmart. Originally launched as ONE (One Finance), OnePay is
  backed by Ribbit Capital and Walmart. It operates a gated developer/partner
  surface at developer.onepay.com (currently access-controlled) rather than a
  public API program.
